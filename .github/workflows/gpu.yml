name: WebGPU migration safeguards
# GPU tests require a provisioned, trusted machine. Do not run untrusted PR code
# automatically on a self-hosted runner. Dispatch against a reviewed revision.
on:
  workflow_dispatch:
    inputs:
      remote_models:
        description: Also load live Khronos assets
        type: boolean
        default: false
jobs:
  gpu:
    runs-on: [self-hosted, Windows, X64, webgpu]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:browser
      - run: pnpm test:browser:offline --output=test-results/offline
      - run: pnpm build
      - run: pnpm test:compressed-build
      - if: inputs.remote_models
        run: pnpm test:browser:remote --output=test-results/remote
      - run: pnpm bench:migration --output=test-results/benchmarks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-results
          path: |
            test-results/
            playwright-report/
